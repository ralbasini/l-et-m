name = "l-et-m-api"
main = "src/index.js"
compatibility_date = "2026-09-30"

# ── R2 bucket (photo storage) ──────────────────────────────────────────────
[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "lobna-et-martin"

# ── D1 database (guests, photos, folders, tags) ─────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "lobna-et-martin"
database_id = "0842eef8-8175-4014-b4ce-b781aa01a933"

# ── Custom domain(s) — optional, but without one the API lives at
#    l-et-m-api.<your-subdomain>.workers.dev, which is fine to start with.
#    Uncomment once your domain's DNS is on Cloudflare. ────────────────────
# routes = [
#   { pattern = "api.your-domain.example/*", zone_name = "your-domain.example" }
# ]

# ── Plain (non-secret) config ───────────────────────────────────────────
[vars]
# Purely informational — R2 has no hard storage quota, this only drives the
# admin dashboard's storage-usage bar (see routes/admin.js state()).
STORAGE_SOFT_LIMIT_GB = "20"

# ── Secrets — do NOT put these here. Set them with:
#      wrangler secret put GUEST_TOKEN_SECRET
#      wrangler secret put ADMIN_TOKEN_SECRET
#      wrangler secret put ADMIN_PASSWORD
#    (generate the two *_SECRET values with `openssl rand -hex 32`, pick
#    your own ADMIN_PASSWORD). See cloudflare/README.md.
