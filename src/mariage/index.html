<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!-- The site-home content lives at the site root (the "default page");
       this stub exists only so /mariage still resolves for anyone
       typing/bookmarking it explicitly. Meta refresh covers no-JS/slow
       cases, the script covers the common case instantly. No <link
       rel="canonical"> here — Vite's HTML asset processor tries to read
       <link href> targets as files and throws EISDIR when the target
       resolves to a real directory (bit the /guest/ -> /photos/ stub). -->
  <meta http-equiv="refresh" content="0; url=../">
  <title>Redirection…</title>
  <script>location.replace('../')</script>
</head>
<body>
  <p>Redirection vers <a href="../">../</a>…</p>
</body>
</html>
