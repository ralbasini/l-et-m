<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>
    if (window.parent !== window) {
      document.documentElement.classList.add('is-embedded')
    } else if (new URLSearchParams(location.search).get('embed') !== '1') {
      location.replace('../#photos')
    }
  </script>
  <meta name="robots" content="noindex, nofollow">
  <title>Ajoutez vos photos — Lobna &amp; Martin</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E">


  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- site-nav -->

  <div id="toast-host" class="toast-host"></div>
  <div id="upload-progress" class="upload-progress" role="status" aria-live="polite" hidden>
    <div class="upload-progress-message">
      <span class="upload-spinner" aria-hidden="true"></span>
      <div class="upload-progress-body">
        <span id="upload-progress-text">Envoi des photos en cours</span>
        <div class="upload-bar" aria-hidden="true"><div id="upload-bar-fill" class="upload-bar-fill"></div></div>
        <span id="upload-progress-detail" class="upload-progress-detail"></span>
      </div>
    </div>
  </div>

  <main>
    <p class="monogram">L<span>&amp;</span>M</p>
    <h1>Ajoutez vos photos</h1>
    <p class="subtitle">Partagez vos souvenirs de la journée...<br>Merci !</p>

    <!-- Step 1: just a name. -->
    <div id="name-step" class="card">
      <form id="name-form">
        <p id="name-error" class="error" hidden></p>
        <label for="name">Bien le bonjour très cher invité&nbsp;!</label>
        <input type="text" id="name" name="name" placeholder="Merci de renseigner ton nom" required>
        <button type="submit" id="name-submit" hidden>Continuer</button>
      </form>
    </div>

    <!-- Step 1b: name collision — someone (maybe this same guest, on
         another device) already has this folder. -->
    <div id="collision-step" class="card" hidden>
      <p class="guest-name">Le nom <strong id="collision-name"></strong> est déjà utilisé — peut-être vous, depuis un autre appareil ?</p>
      <button type="button" id="collision-yes">Oui, c'est moi</button>
      <button type="button" id="collision-no" class="link-btn">Non, choisir un autre nom</button>
    </div>

    <!-- Step 2: identity known — upload + own photos. -->
    <div id="upload-step" class="card" hidden>
      <p class="guest-name">Salut <strong id="guest-name-label"></strong>&nbsp;! — <button type="button" id="not-me-btn" class="link-inline">ce n'est pas moi</button></p>
      <p id="quota-full" class="empty" hidden></p>
      <form id="upload-form">
        <!-- How many of the guest's photos are used: the bar fills as they send. -->
        <div class="quota-meter">
          <div id="quota-bar" class="quota-bar" role="progressbar" aria-valuemin="0" aria-labelledby="photos-label"><div id="quota-bar-fill" class="quota-bar-fill"></div></div>
          <p id="photos-label" class="quota-label"></p>
        </div>
        <label id="dropzone" for="photos" class="dropzone">
          <input type="file" id="photos" name="photos[]" accept="image/*" multiple required>
          <span class="dropzone-icon" aria-hidden="true">+</span>
          <span id="dropzone-text" class="dropzone-text">Choisir des photos</span>
        </label>
        <button type="submit" id="upload-submit" class="upload-submit" disabled hidden>Envoyer</button>
        <p id="preview-warning" class="warning" hidden></p>
        <div id="preview-grid" class="grid preview-grid" hidden></div>
      </form>
    </div>

    <div id="my-photos" class="card my-photos" hidden>
      <label>Vos photos</label>
      <a href="../galerie/#galerie" class="btn-link my-photos-link">Voir les photos de tous les invités</a>
      <div id="photos-grid" class="grid"></div>
    </div>
  </main>

  <!-- site-footer -->

  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox-overlay" id="lightbox-overlay"></div>
    <button type="button" id="lightbox-close" class="lightbox-btn lightbox-close" aria-label="Fermer">×</button>
    <button type="button" id="lightbox-prev" class="lightbox-btn lightbox-nav lightbox-prev" aria-label="Photo précédente">‹</button>
    <figure class="lightbox-figure">
      <img id="lightbox-img" class="lightbox-img" src="" alt="">
      <figcaption id="lightbox-count" class="lightbox-count"></figcaption>
    </figure>
    <button type="button" id="lightbox-next" class="lightbox-btn lightbox-nav lightbox-next" aria-label="Photo suivante">›</button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
