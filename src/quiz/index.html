<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Quiz — Lobna &amp; Martin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
  <!-- Owns the site fonts (MoreSugar-Thin, Apricot, Quicksand); declared nowhere else. -->
  <link rel="stylesheet" href="/site-chrome.css">
</head>
<body class="player">
  <div id="offline" class="offline" hidden>Reconnexion…</div>

  <main>
    <p class="brand">L<span>&amp;</span>M</p>

    <section id="screen-join" class="screen" hidden>
      <h1>Le grooond quiz du mariage</h1>
      <form id="join-form">
        <div id="av-preview" class="av-preview"></div>
        <div class="av-group"><span class="av-label">Animal</span><div id="av-animals" class="av-choices"></div></div>
        <div class="av-group"><span class="av-label">Pelage</span><div id="av-colors" class="av-choices"></div></div>
        <div class="av-group"><span class="av-label">Accessoire</span><div id="av-acc" class="av-choices"></div></div>
        <button type="button" id="av-random" class="ghost">🎲 Au hasard</button>
        <div id="name-field" class="name-field">
          <label for="name">Votre prénom</label>
          <input id="name" type="text" maxlength="20" autocomplete="given-name" placeholder="ex. Camille" required>
        </div>
        <p id="join-error" class="error" hidden></p>
        <button type="submit" id="join-submit">Rejoindre</button>
        <button type="button" id="edit-cancel" class="ghost" hidden>Annuler</button>
      </form>
    </section>

    <section id="screen-wait" class="screen" hidden>
      <div id="wait-avatar" class="av-preview"></div>
      <h1 id="wait-title">C'est noté !</h1>
      <p id="wait-text">Le quiz va bientôt commencer. Gardez cette page ouverte.</p>
      <button type="button" id="edit-avatar" class="ghost">Modifier mon personnage</button>
    </section>

    <section id="screen-question" class="screen" hidden>
      <div class="timer"><div id="timer-bar"></div></div>
      <p class="meta"><span id="q-count"></span><span id="q-time"></span></p>
      <h2 id="q-text"></h2>
      <div id="q-options" class="options"></div>
    </section>

    <section id="screen-sent" class="screen" hidden>
      <div id="sent-avatar" class="av-preview"></div>
      <h1>Réponse envoyée</h1>
      <p>Réponse choisie : <strong id="sent-choice"></strong></p>
      <p class="hint">En attente des autres joueurs…</p>
    </section>

    <section id="screen-result" class="screen" hidden>
      <h1 id="result-title"></h1>
      <div id="result-answer" class="options result-options"></div>
      <p id="result-delta" class="big"></p>
      <p id="result-rank"></p>
      <p id="result-move" class="move" hidden></p>
    </section>

    <section id="screen-final" class="screen" hidden>
      <h1>Fin du quiz</h1>
      <p id="final-rank" class="big"></p>
      <p id="final-score"></p>
      <ol id="final-top" class="board"></ol>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
